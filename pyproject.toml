[project]
name = "magi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ffesb", email = "ffesb@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "croniter>=6.2.4",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pytest>=8.0.0",
    "python-telegram-bot>=22.8",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
    "uvicorn>=0.32.0",
]

[project.scripts]
magi-daemon = "magi.daemon:main"
magi = "magi.daemon:main"
magi-tui = "magi.tui.app:main"
magi-web = "magi.web.server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
